name: Privacy Policy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/privacy-policy/**'
      - '.github/workflows/privacy-policy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage privacy policy
        run: |
          mkdir -p _site/privacy-policy
          cp docs/privacy-policy/index.html _site/privacy-policy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
